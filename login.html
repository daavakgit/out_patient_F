<!DOCTYPE html>

  <script>
    document.documentElement.classList.add('entry-pending');

  </script>
  <style>
    *, *::before, *::after {

    @font-face {

    @font-face {

      --fieldpad: 19px;

      --gBorder: #c8c8ca;   --divider: #b1b1b2;     --page: #fefefe;

      --mobile-hero-h: clamp(244px, 34svh, 304px);

    html, body {
      height: 100%;
      background: var(--page);
    }

    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      overflow: hidden;
      font-family: 'FreeSans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      color: var(--ink);

    .stage {

      inset: 0;
      overflow: hidden;
    }

    .photo {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;

    .hero {

      left: 0;
      bottom: 0;
      width: 836px;
      height: 949px;
      transform-origin: left bottom;
      pointer-events: none;
    }

    .hero > * {
      pointer-events: auto;
    }

    .badge {
      position: absolute;
      left: var(--badge-left);
      top: var(--badge-top);
      display: inline-flex;
      align-items: center;
      height: 37px;
      gap: var(--badge-gap);
      padding: 0 16px 0 19px;
      border-radius: 999px;
      background: var(--badge-bg);
      backdrop-filter: blur(7px) saturate(120%);

      font-weight: var(--badge-fw);
      letter-spacing: var(--badge-ls);
      word-spacing: var(--badge-ws);

    }

    .badge-glyph {

      height: 16.27px;
      position: relative;
      top: -1px;
      flex-shrink: 0;
    }

    .hl-wrap {
      position: relative;
    }

    .hl {
      position: absolute;
      font-family: 'Eloquia', sans-serif;
      font-variation-settings: 'wght' var(--hl-wght);
      line-height: var(--hl-lh);
      color: var(--ink);
      white-space: nowrap;
    }

    #hl1 {
      left: var(--hl1-left);
      top: var(--hl1-top);
      font-size: var(--hl1-fs);
      letter-spacing: var(--hl1-ls);
      word-spacing: var(--hl1-ws);
    }

    #hl2 {
      left: var(--hl2-left);
      top: var(--hl2-top);
      font-size: var(--hl2-fs);
      letter-spacing: var(--hl2-ls);
    }

    .pane {
      position: absolute;
      left: 57.1038%;
      right: 0;
      top: 0;
      bottom: 0;
    }

    .card {
      position: absolute;

      top: 14px;
      width: 613px;
      height: 922px;
      border-radius: 26px;
      overflow: hidden;
      background: rgba(254, 254, 254, 0.90);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1px solid rgba(0, 0, 0, 0.036);
      box-shadow: var(--card-shadow);
    }

    .card-in {
      position: absolute;
      left: 0;
      top: 0;
      width: 613px;
      height: 922px;
      transform-origin: left top;
    }

    .col {
      position: absolute;
      left: 62px;
      width: 488px;
      text-align: center;
    }

    #h1 {
      top: var(--h1-top);
      font-family: 'Eloquia', sans-serif;
      font-variation-settings: 'wght' var(--h1-wght);
      font-size: var(--h1-fs);
      letter-spacing: var(--h1-ls);
      word-spacing: var(--h1-ws);
      color: var(--h1-color);
      line-height: 1.15;
    }

    #sub {
      top: var(--sub-top);
      font-size: var(--sub-fs);
      letter-spacing: var(--sub-ls);
      word-spacing: var(--sub-ws);
      font-weight: var(--sub-fw);
      color: var(--sub-grey);
      line-height: 1.3;
    }

    #sub b {
      font-weight: var(--sub-fwb);
      color: var(--ink);
    }

    .field {
      position: absolute;
      left: 62px;
      width: 489px;
      display: flex;
      align-items: center;
      border-radius: 12px;
    }

    .field input {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
      outline: none;
      color: var(--ink);
      font-family: inherit;
    }

    .field input::placeholder {
      color: var(--ph);
      opacity: 1;
    }

    #email {
      top: 203px;
      height: 61px;
      background: var(--inputFill);
      border: 1.5px solid var(--inputBorder);
    }

    #email input {
      padding: 0 var(--fieldpad);
      padding-left: var(--eph-left);
      font-size: var(--eph-fs);
      letter-spacing: var(--eph-ls);
      font-weight: var(--eph-fw);
      word-spacing: var(--eph-ws);
    }

    #pw {
      top: 273.5px;
      height: 59px;
      background: var(--pwFill);
      border: 0;
    }

    #pw input {
      padding: 0 var(--fieldpad);
      padding-left: var(--pph-left);
      font-size: var(--pph-fs);
      letter-spacing: var(--pph-ls);
      font-weight: var(--pph-fw);
    }

    #loginBtn {
      position: absolute;
      left: 62px;
      top: 366px;
      width: 489px;
      height: 65.5px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--btn1) 0%, var(--btn2) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--login-gap);
      padding-left: var(--login-padl);
      padding-right: 4px;
      box-shadow: 0 8px 20px rgba(18, 26, 34, 0.16), 0 2px 5px rgba(18, 26, 34, 0.10);
      border: none;
      cursor: pointer;
      font-size: var(--login-fs);
      font-weight: var(--login-fw);
      letter-spacing: var(--login-ls);
      font-family: inherit;
      transition: transform 0.18s cubic-bezier(0.2, 0.7, 0.3, 1), box-shadow 0.18s ease, filter 0.18s ease;
    }

    #loginBtn:hover {
      filter: brightness(1.12);
    }

    #loginBtn:active {
      transform: translateY(1px);
    }

    #loginBtn span {
      display: inline-block;
      transform: translateY(var(--login-dy));
    }

    .divider {
      position: absolute;
      left: 63px;
      top: var(--div-top);
      width: 487px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--or);
    }

    .divider i {
      height: 1.5px;
      background: var(--divider);
      display: block;
    }

    .divider i:first-child {
      flex: 0 0 var(--or-line-l);
    }

    .divider i:last-child {
      flex: 0 0 var(--or-line-r);
    }

    .divider b {
      flex: 1 1 auto;
      text-align: center;
      font-size: var(--or-fs);
      font-weight: var(--or-fw);
      letter-spacing: var(--or-ls);
      transform: translate(var(--or-dx), var(--or-dy));
    }

    #gBtn {
      position: absolute;
      left: 62px;
      top: 535px;
      width: 489px;
      height: 59.5px;
      border: 1.5px solid var(--gBorder);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--g-gap);
      color: var(--gtext);
      cursor: pointer;
      font-size: var(--gt-fs);
      font-weight: var(--gt-fw);
      letter-spacing: var(--gt-ls);
      word-spacing: var(--gt-ws);
      font-family: inherit;
      transition: background 0.18s ease, box-shadow 0.18s ease, transform 0.18s cubic-bezier(0.2, 0.7, 0.3, 1);
    }

    #gBtn:hover {
      background: #fff;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.07);
    }

    #gBtn:active {
      transform: translateY(1px);
    }

    #gBtn span {
      transform: translateY(var(--gt-dy));
    }

    #bottom {
      position: absolute;
      left: 62px;
      width: 489px;
      top: var(--bt-top);
      text-align: center;
      font-size: var(--bt-fs);
      font-weight: var(--bt-fw);
      letter-spacing: var(--bt-ls);
      word-spacing: var(--bt-ws);
      color: var(--bottom);
    }

    #bottom a {
      color: #000;
      font-weight: var(--bt-fwb);
      text-decoration: underline;
      text-underline-offset: var(--bt-uo);
      text-decoration-thickness: 2px;
    }

    :focus-visible {
      outline: 2px solid #2b6cb0;
      outline-offset: 2px;
    }

    /* Tablet Portrait Mode */
    body.tabport .photo {
      width: 100% !important;
      height: var(--band-h) !important;
      left: 0 !important;
      top: 0 !important;
    }

    body.tabport .photo-img--tall {
      display: none !important;
    }

    body.tabport .photo-img--wide {
      display: block !important;
      object-position: 50% 50% !important;
    }

    body.tabport .pane {
      left: 0 !important;
      top: var(--band-h) !important;
      width: 100% !important;
      bottom: 0 !important;
    }

    body.tabport .hero {
      position: absolute !important;
      left: var(--tp-hero-side) !important;
      bottom: var(--tp-hero-b) !important;
      width: auto !important;
      height: auto !important;
      display: flex;
      flex-direction: column;
      gap: var(--tp-hero-gap);
      transform: none !important;
    }

    body.tabport .badge {
      position: static !important;
      transform: scale(var(--badge-k));
      transform-origin: left bottom;
    }

    body.tabport .hl-wrap {
      width: var(--tp-headline-w);
    }

    body.tabport .hl {
      position: static !important;
      display: inline !important;
      font-size: var(--tp-hero-fs) !important;
      line-height: var(--tp-hero-lh) !important;
    }

    body.tabport .card {
      left: var(--tp-side-margin) !important;
      right: var(--tp-side-margin) !important;
      top: 0 !important;
      width: auto !important;
      height: calc(100% - var(--tp-footer)) !important;
    }

    body.tabport .card-in {
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      transform: none !important;
    }

    body.tabport .col,
    body.tabport .field,
    body.tabport #loginBtn,
    body.tabport .divider,
    body.tabport #gBtn,
    body.tabport #bottom {
      left: var(--tp-pad) !important;
      width: calc(100% - (var(--tp-pad) * 2)) !important;
    }

    body.tabport #h1 {
      top: var(--tp-h1-top) !important;
      font-size: var(--tp-h1-fs) !important;
      letter-spacing: calc(var(--h1-ls) / var(--h1-fs) * var(--tp-h1-fs)) !important;
    }

    body.tabport #sub {
      top: var(--tp-sub-top) !important;
      font-size: var(--tp-sub-fs) !important;
      letter-spacing: calc(var(--sub-ls) / var(--sub-fs) * var(--tp-sub-fs)) !important;
    }

    body.tabport #email {
      top: var(--tp-em-top) !important;
      height: var(--tp-em-h) !important;
      border-radius: var(--tp-em-r) !important;
    }

    body.tabport #email input {
      font-size: var(--tp-eph-fs) !important;
      padding-left: var(--tp-eph-pad) !important;
    }

    body.tabport #pw {
      top: var(--tp-pw-top) !important;
      height: var(--tp-pw-h) !important;
    }

    body.tabport #loginBtn {
      top: var(--tp-btn-top) !important;
      height: var(--tp-btn-h) !important;
      font-size: var(--tp-btn-fs) !important;
      gap: var(--tp-btn-gap) !important;
    }

    body.tabport .divider {
      top: var(--tp-div-top) !important;
    }

    body.tabport .divider b {
      font-size: var(--tp-or-fs) !important;
      padding: 0 var(--tp-or-pad) !important;
    }

    body.tabport #gBtn {
      top: var(--tp-g-top) !important;
      height: var(--tp-g-h) !important;
      font-size: var(--tp-gt-fs) !important;
      gap: var(--tp-g-gap) !important;
    }

    body.tabport #bottom {
      top: var(--tp-bt-top) !important;
      font-size: var(--tp-bt-fs) !important;
    }

    /* Mobile Stacked Mode (<700px) */
    body.stacked {
      height: auto !important;
      min-height: 100% !important;
      overflow-y: auto !important;
      background: #fff !important;
    }

    body.stacked .stage {
      position: relative !important;
      inset: auto !important;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: visible !important;
    }

    body.stacked .photo {
      position: relative !important;
      width: 100% !important;
      height: var(--mobile-hero-h) !important;
      left: auto !important;
      top: auto !important;
      overflow: hidden;
    }

    body.stacked .photo-img--tall {
      display: none !important;
    }

    body.stacked .photo-img--wide {
      display: block !important;
      object-position: 64% 48% !important;
      transform: scale(1.015);
    }

    body.stacked .scrim {
      display: block !important;
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(7,10,13,.02) 18%, rgba(7,10,13,.12) 48%, rgba(7,10,13,.78) 100%);
      pointer-events: none;
    }

    body.stacked .hero {
      position: absolute !important;
      left: 24px !important;
      bottom: 38px !important;
      width: calc(100% - 48px) !important;
      height: auto !important;
      transform: none !important;
      display: flex;
      flex-direction: column;
      z-index: 2;
    }

    body.stacked .badge {
      position: static !important;
      height: 31px !important;
      padding: 0 12px !important;
      background: rgba(24, 27, 30, 0.82) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18) !important;
      font-size: 11px !important;
      margin-bottom: 10px;
      width: fit-content;
    }

    body.stacked .hl-wrap {
      display: flex;
      flex-direction: column;
    }

    body.stacked .hl {
      position: static !important;
      color: #fff !important;
      font-size: clamp(30px, 8.8vw, 38px) !important;
      letter-spacing: -0.035em !important;
      line-height: 0.96 !important;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.32) !important;
    }

    body.stacked .pane {
      position: relative !important;
      left: auto !important;
      right: auto !important;
      top: auto !important;
      bottom: auto !important;
      width: 100% !important;
      flex: 1 0 auto;
    }

    body.stacked .card {
      position: relative !important;
      left: auto !important;
      top: auto !important;
      margin: -28px 0 0 !important;
      width: 100% !important;
      height: auto !important;
      border-radius: 28px 28px 0 0 !important;
      background: #fff !important;
      border: 0 !important;
      box-shadow: 0 -10px 28px rgba(20, 28, 36, 0.10) !important;
      min-height: calc(100svh - var(--mobile-hero-h) + 28px) !important;
    }

    body.stacked .card-in {
      position: relative !important;
      left: auto !important;
      top: auto !important;
      max-width: 500px;
      margin: 0 auto;
      padding: 36px clamp(24px, 7vw, 38px) max(30px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100% !important;
      height: auto !important;
      transform: none !important;
      gap: 14px;
    }

    body.stacked .col,
    body.stacked .field,
    body.stacked #loginBtn,
    body.stacked .divider,
    body.stacked #gBtn,
    body.stacked #bottom {
      position: static !important;
      left: auto !important;
      top: auto !important;
      width: 100% !important;
    }

    body.stacked .field input {
      font-size: 16px !important;
    }

    body.stacked #h1 {
      font-size: clamp(31px, 8.8vw, 38px) !important;
      margin-bottom: 2px;
    }

    body.stacked #sub {
      font-size: 15px !important;
      margin-bottom: 12px;
    }

    body.stacked #email {
      height: 56px !important;
    }

    body.stacked #pw {
      height: 56px !important;
    }

    body.stacked #loginBtn {
      height: 58px !important;
      margin-top: 6px;
    }

    body.stacked .divider {
      margin: 10px 0;
    }

    body.stacked #gBtn {
      height: 56px !important;
    }

    body.stacked #bottom {
      font-size: 14px !important;
      margin-top: 14px;
    }

    @media (max-width: 370px) {
      :root {
        --mobile-hero-h: 232px;
      }
      body.stacked .hl {
        font-size: 30px !important;
      }
      body.stacked .card-in {
        padding: 28px 18px 24px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      :root {
        --mobile-hero-h: 208px;
      }
      body.stacked .card-in {
        justify-content: flex-start;
      }
    }

    /* Entrance Animation First Frame */
    .entry-pending .card,
    .entry-pending .badge,
    .entry-pending #hl1,
    .entry-pending #hl2,
    .entry-pending #h1,
    .entry-pending #sub,
    .entry-pending #email,
    .entry-pending #pw,
    .entry-pending #loginBtn,
    .entry-pending .divider,
    .entry-pending #gBtn,
    .entry-pending #bottom {
      opacity: 0;
      will-change: transform, opacity, clip-path;
    }

    .entry-pending .card { transform: translateY(12px) scale(0.988); }
    .entry-pending .badge { transform: translateY(8px); }
    .entry-pending #hl1,
    .entry-pending #hl2 { transform: translateY(16px); clip-path: inset(100% 0 0 0); }
    .entry-pending #h1,
    .entry-pending #sub { transform: translateY(10px); }
    .entry-pending #email,
    .entry-pending #pw,
    .entry-pending #loginBtn,
    .entry-pending #gBtn { transform: translateY(8px); }
    .entry-pending .divider,
    .entry-pending #bottom { transform: translateY(6px); }

    @media (max-width: 699px) {
      .entry-pending .card { transform: translateY(14px); }
      .entry-pending #hl1,
      .entry-pending #hl2 { transform: translateY(12px); }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
        animation: none !important;
      }
      .entry-pending .card,
      .entry-pending .badge,
      .entry-pending #hl1,
      .entry-pending #hl2,
      .entry-pending #h1,
      .entry-pending #sub,
      .entry-pending #email,
      .entry-pending #pw,
      .entry-pending #loginBtn,
      .entry-pending .divider,
      .entry-pending #gBtn,
      .entry-pending #bottom {
        opacity: 1 !important;
        transform: none !important;
        clip-path: none !important;
        will-change: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <section class="photo">
      <video class="photo-img photo-img--tall" autoplay muted loop playsinline preload="auto" poster="data:image/webp;base64,UklGRkAAAABXRUJQVlA4IDQAAADwAQCdASoFAAYAPtFUo02nJaQjIAMEiWUAyAAP7w6f/817291a1tW1ra1ra1ra1ra1ra1rYAAA">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_052122_e77a27e6-17f1-4794-889b-3ceaa0e9e8cb.mp4" type="video/mp4">
      </video>
      <video class="photo-img photo-img--wide" aria-hidden="true" autoplay muted loop playsinline preload="auto" poster="data:image/webp;base64,UklGRkAAAABXRUJQVlA4IDQAAADwAQCdASoFAAYAPtFUo02nJaQjIAMEiWUAyAAP7w6f/817291a1tW1ra1ra1ra1ra1ra1rYAAA">
        <source src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260813_052122_e77a27e6-17f1-4794-889b-3ceaa0e9e8cb.mp4" type="video/mp4">

            <input type="password" autocomplete="current-password" aria-label="Password" placeholder="Password" />

              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>

  </div>

  <script>
    (function () {
      var REF_W = 1464, REF_H = 949, PHOTO_W = 836, PANE_W = 628, CARD_W = 613, CARD_H = 922;
      var CONTENT_H = 697;
      var IMG_W = 1177, IMG_H = 1336, IMG_REF_SCALE = 836 / 1177;
      var PANE_RATIO = PANE_W / REF_W;
      var HERO_W = 681, HERO_H = 219;
      var REF_CARD_ASPECT = 692 / 855;
      var RAMP_HI = 1280, RAMP_LO = 1000, PHOTO_MIN = 0.42;
      var RAMP_LO2 = 820, PHOTO_MIN2 = 0.36;
      var TP = {
        "pad": 0.1076, "h1Top": 0.08656, "h1Fs": 0.06839, "subTop": 0.17368, "subFs": 0.0309,
        "emTop": 0.25435, "emH": 0.10257, "emR": 0.0202, "ephFs": 0.02702, "ephPad": 0.0332,
        "pwTop": 0.36851, "pwH": 0.10839, "btnTop": 0.50435, "btnH": 0.10981, "btnFs": 0.0275,
        "arrow": 0.026, "btnGap": 0.02, "divTop": 0.68222, "orFs": 0.02245, "orPad": 0.051,
        "divH": 0.0026, "gTop": 0.76445, "gH": 0.09966, "gIcon": 0.032, "gtFs": 0.03205,
        "gGap": 0.026, "btTop": 0.89668, "btFs": 0.02876, "heroFs": 0.1058, "badgeH": 0.0742,
        "heroLh": 1.1246, "heroBot": 0.06493, "heroGap": -0.30423, "heroSide": 0.0525
      };

      var mqLandscape = window.matchMedia('(min-width:700px) and (min-aspect-ratio:51/50)');
      var mqPortrait  = window.matchMedia('(min-width:700px) and (max-aspect-ratio:51/50)');

      var photo = document.querySelector('.photo');
      var pane = document.querySelector('.pane');
      var card = document.getElementById('card');
      var cardIn = document.getElementById('cardIn');
      var hero = document.getElementById('hero');
      var currentMode = '';

      function photoRatio(vw) {
        if (vw >= RAMP_HI) return 1 - PANE_RATIO;
        if (vw >= RAMP_LO) {
          return PHOTO_MIN + ((vw - RAMP_LO) / (RAMP_HI - RAMP_LO)) * ((1 - PANE_RATIO) - PHOTO_MIN);
        }
        if (vw >= RAMP_LO2) {
          return PHOTO_MIN2 + ((vw - RAMP_LO2) / (RAMP_LO - RAMP_LO2)) * (PHOTO_MIN - PHOTO_MIN2);
        }
        return PHOTO_MIN2;
      }

      function clearInline() {
        if (photo) photo.style.cssText = '';
        if (pane) pane.style.cssText = '';
        if (card) card.style.cssText = '';
        if (cardIn) cardIn.style.cssText = '';
        if (hero) hero.style.cssText = '';
      }

      function setMode(mode) {
        if (currentMode !== mode) {
          clearInline();
          document.body.classList.remove('tabport', 'stacked');
          if (mode === 'tabport') document.body.classList.add('tabport');
          if (mode === 'phone') document.body.classList.add('stacked');
          currentMode = mode;
        }
      }

      function headlineMeasure() {
        var span = document.createElement('span');
        span.textContent = 'Find Signal to Action Instantly';
        span.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap;font-family:Eloquia,sans-serif;font-variation-settings:"wght" 578;font-size:69px;';
        document.body.appendChild(span);
        var w = span.offsetWidth;
        document.body.removeChild(span);
        return w || 500;
      }

      function layout() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;

        if (vw < 700) {
          setMode('phone');
          return;
        }

        if (mqPortrait.matches) {
          setMode('tabport');
          var band = Math.round(vh * 0.425);
          var sideMargin = Math.round(vw * TP.heroSide);
          var footer = Math.round(vh * 0.0297);
          var cardH = vh - band - footer;
          var cardW = vw - (sideMargin * 2);
          var S = Math.min(cardH, cardW * REF_CARD_ASPECT);

          document.documentElement.style.setProperty('--band-h', band + 'px');
          document.documentElement.style.setProperty('--tp-side-margin', sideMargin + 'px');
          document.documentElement.style.setProperty('--tp-footer', footer + 'px');
          document.documentElement.style.setProperty('--badge-k', (band * TP.badgeH / 37).toFixed(4));
          document.documentElement.style.setProperty('--tp-hero-b', Math.round(band * TP.heroBot) + 'px');
          document.documentElement.style.setProperty('--tp-hero-gap', Math.round(band * TP.heroGap) + 'px');
          document.documentElement.style.setProperty('--tp-hero-side', sideMargin + 'px');
          document.documentElement.style.setProperty('--tp-hero-fs', (band * TP.heroFs) + 'px');
          document.documentElement.style.setProperty('--tp-hero-lh', TP.heroLh);
          document.documentElement.style.setProperty('--tp-headline-w', Math.round(headlineMeasure() * 0.61) + 'px');

          document.documentElement.style.setProperty('--tp-pad', Math.round(cardW * TP.pad) + 'px');
          document.documentElement.style.setProperty('--tp-h1-top', Math.round(cardH * TP.h1Top) + 'px');
          document.documentElement.style.setProperty('--tp-h1-fs', (S * TP.h1Fs) + 'px');
          document.documentElement.style.setProperty('--tp-sub-top', Math.round(cardH * TP.subTop) + 'px');
          document.documentElement.style.setProperty('--tp-sub-fs', (S * TP.subFs) + 'px');
          document.documentElement.style.setProperty('--tp-em-top', Math.round(cardH * TP.emTop) + 'px');
          document.documentElement.style.setProperty('--tp-em-h', Math.round(cardH * TP.emH) + 'px');
          document.documentElement.style.setProperty('--tp-em-r', Math.round(cardH * TP.emR) + 'px');
          document.documentElement.style.setProperty('--tp-eph-fs', (S * TP.ephFs) + 'px');
          document.documentElement.style.setProperty('--tp-eph-pad', Math.round(cardW * TP.ephPad) + 'px');
          document.documentElement.style.setProperty('--tp-pw-top', Math.round(cardH * TP.pwTop) + 'px');
          document.documentElement.style.setProperty('--tp-pw-h', Math.round(cardH * TP.pwH) + 'px');
          document.documentElement.style.setProperty('--tp-btn-top', Math.round(cardH * TP.btnTop) + 'px');
          document.documentElement.style.setProperty('--tp-btn-h', Math.round(cardH * TP.btnH) + 'px');
          document.documentElement.style.setProperty('--tp-btn-fs', (S * TP.btnFs) + 'px');
          document.documentElement.style.setProperty('--tp-btn-gap', Math.round(S * TP.btnGap) + 'px');
          document.documentElement.style.setProperty('--tp-div-top', Math.round(cardH * TP.divTop) + 'px');
          document.documentElement.style.setProperty('--tp-or-fs', (S * TP.orFs) + 'px');
          document.documentElement.style.setProperty('--tp-or-pad', Math.round(cardW * TP.orPad) + 'px');
          document.documentElement.style.setProperty('--tp-g-top', Math.round(cardH * TP.gTop) + 'px');
          document.documentElement.style.setProperty('--tp-g-h', Math.round(cardH * TP.gH) + 'px');
          document.documentElement.style.setProperty('--tp-gt-fs', (S * TP.gtFs) + 'px');
          document.documentElement.style.setProperty('--tp-g-gap', Math.round(S * TP.gGap) + 'px');
          document.documentElement.style.setProperty('--tp-bt-top', Math.round(cardH * TP.btTop) + 'px');
          document.documentElement.style.setProperty('--tp-bt-fs', (S * TP.btFs) + 'px');
          return;
        }

        // Mode A: Desktop / Landscape
        setMode('land');
        var pr = photoRatio(vw);
        var photoW = Math.round(vw * pr);
        var paneW = vw - photoW;

        if (photo) photo.style.width = photoW + 'px';
        if (pane) {
          pane.style.left = photoW + 'px';
          pane.style.width = paneW + 'px';
        }

        // Place card
        var cs = Math.min(paneW / PANE_W, vh / CONTENT_H);
        var gapL = 1 * cs;
        var mT = 14 * cs;
        var mB = 13 * cs;
        var mR = 14 * cs;
        var cw = Math.max(CARD_W * cs, paneW - gapL - mR);
        var ch = vh - mT - mB;

        if (card) {
          card.style.left = gapL + 'px';
          card.style.top = mT + 'px';
          card.style.width = cw + 'px';
          card.style.height = ch + 'px';
          card.style.borderRadius = (26 * cs) + 'px';
          card.style.borderWidth = Math.max(1, cs) + 'px';
        }

        if (cardIn) {
          cardIn.style.transform = 'translate(' + ((cw - CARD_W * cs) / 2) + 'px,0) scale(' + cs + ')';
        }

        // Seat hero
        var bandH = vh;
        var imgScale = Math.max(photoW / IMG_W, bandH / IMG_H);
        var s = Math.min(imgScale / IMG_REF_SCALE, photoW * 0.92 / HERO_W);
        if (hero) {
          hero.style.transform = 'scale(' + s + ')';
          hero.style.transformOrigin = 'left bottom';
          hero.style.bottom = '0px';
        }
      }

      window.addEventListener('resize', layout, { passive: true });
      window.addEventListener('orientationchange', layout);
      if (mqLandscape.addEventListener) {
        mqLandscape.addEventListener('change', layout);
        mqPortrait.addEventListener('change', layout);
      }
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(layout);
      }
      layout();
    })();

    // Entrance Animation Timeline
    (function () {
      function releaseEntrance() {
        document.documentElement.classList.remove('entry-pending');
        if (window.__entryFallback) {
          clearTimeout(window.__entryFallback);
          window.__entryFallback = null;
        }
      }

      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion || !Element.prototype.animate) {
        releaseEntrance();
        return;
      }

      var ease = 'cubic-bezier(.16,1,.3,1)';
      var softEase = 'cubic-bezier(.22,1,.36,1)';
      var compact = window.matchMedia('(max-width:699px)').matches;

      var cardEl = document.querySelector('.card');
      var badgeEl = document.querySelector('.badge');
      var hl1El = document.getElementById('hl1');
      var hl2El = document.getElementById('hl2');
      var h1El = document.getElementById('h1');
      var subEl = document.getElementById('sub');
      var emailEl = document.getElementById('email');
      var pwEl = document.getElementById('pw');
      var loginBtnEl = document.getElementById('loginBtn');
      var dividerEl = document.querySelector('.divider');
      var gBtnEl = document.getElementById('gBtn');
      var bottomEl = document.getElementById('bottom');

      var steps = [
        { el: cardEl, delay: 40, duration: 820, ease: ease, from: { opacity: 0, transform: compact ? 'translateY(14px)' : 'translateY(12px) scale(.988)' } },
        { el: badgeEl, delay: 120, duration: 480, ease: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
        { el: hl1El, delay: 240, duration: 760, ease: ease, from: { opacity: 0, transform: compact ? 'translateY(12px)' : 'translateY(16px)', clipPath: 'inset(100% 0 0 0)' }, to: { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' } },
        { el: hl2El, delay: 330, duration: 760, ease: ease, from: { opacity: 0, transform: compact ? 'translateY(12px)' : 'translateY(16px)', clipPath: 'inset(100% 0 0 0)' }, to: { opacity: 1, transform: 'none', clipPath: 'inset(0 0 0 0)' } },
        { el: h1El, delay: 470, duration: 620, ease: ease, from: { opacity: 0, transform: 'translateY(10px)' } },
        { el: subEl, delay: 570, duration: 560, ease: ease, from: { opacity: 0, transform: 'translateY(10px)' } },
        { el: emailEl, delay: 720, duration: 520, ease: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
        { el: pwEl, delay: 790, duration: 520, ease: softEase, from: { opacity: 0, transform: 'translateY(8px)' } },
        { el: loginBtnEl, delay: 930, duration: 560, ease: ease, from: { opacity: 0, transform: 'translateY(8px)' } },
        { el: dividerEl, delay: 1060, duration: 440, ease: softEase, from: { opacity: 0, transform: 'translateY(6px)' } },
        { el: gBtnEl, delay: 1150, duration: 540, ease: ease, from: { opacity: 0, transform: 'translateY(8px)' } },
        { el: bottomEl, delay: 1260, duration: 500, ease: softEase, from: { opacity: 0, transform: 'translateY(6px)' } }
      ];

      var fontGate = (document.fonts && document.fonts.ready)
        ? Promise.race([document.fonts.ready, new Promise(function(r){ setTimeout(r, 650); })])
        : new Promise(function(r){ setTimeout(r, 650); });

      fontGate.then(function() {
        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            var anims = [];
            steps.forEach(function (s) {
              if (!s.el) return;
              var keyframes = [
                s.from,
                s.to || { opacity: 1, transform: 'none' }
              ];
              var a = s.el.animate(keyframes, {
                delay: s.delay,
                duration: s.duration,
                easing: s.ease,
                fill: 'both'
              });
              anims.push(a);
            });

            releaseEntrance();

            Promise.allSettled(anims.map(function (a) { return a.finished; })).then(function () {
              anims.forEach(function (a) { a.cancel(); });
              anims.length = 0;
            });
          });
        });
      });
    })();
  </script>
