<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172D35" />
      <stop offset="100%" stop-color="#081C22" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087F8C" />
      <stop offset="45%" stop-color="#12A89D" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#12A89D" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- Soft Ambient Glow behind pulse -->
  <path
    d="M 18 64 L 40 64 L 50 42 L 64 88 L 76 28 L 88 78 L 96 64 L 110 64"
    fill="none"
    stroke="#087F8C"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.3"
  />

  <!-- Main Vitality Pulse Wave -->
  <path
    d="M 18 64 L 40 64 L 50 42 L 64 88 L 76 28 L 88 78 L 96 64 L 110 64"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Vitality Peak Beacon Dot -->
  <circle cx="76" cy="28" r="9" fill="#12A89D" opacity="0.35" />
  <circle cx="76" cy="28" r="4.5" fill="#FFFFFF" />
</svg>
